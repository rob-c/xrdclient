name: Datasets site

# The public datasets directory, rebuilt from this repository on demand and
# republished as one artifact: every redistributable dataset converted to
# ROOT, the index that lets ``xrd.ml.load("mnist")`` find it by name, and
# the page and server configuration that put it on the web.
#
# Run by hand (pick the datasets and the URL), or by pushing a ``site-*``
# tag for a full rebuild. Deployment is deliberately just "download the
# artifact and unpack it where nginx looks": the directory is the deploy.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "glob of dataset names to build (empty for all)"
        default: ""
      base-url:
        description: "where the site will be served from"
        default: "https://data.example.org"
  push:
    tags: ["site-*"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      # The downloads come from each dataset's publisher, so a flaky mirror
      # fails its own dataset and the step, not silently the site: build
      # exits nonzero if any conversion failed, and verify refuses an index
      # that does not match the bytes next to it.
      - name: build
        run: >-
          xrd-datasets build site
          ${{ inputs.only && format('--only "{0}"', inputs.only) || '' }}
          --jobs 4
      - name: verify
        run: xrd-datasets verify site
      - name: site
        run: >-
          xrd-datasets site site
          --base-url "${{ inputs.base-url || 'https://data.example.org' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: datasets-site
          path: site/
          # The .root files are already compressed; zip level 0 keeps the
          # upload from spending an hour re-finding that out.
          compression-level: 0
