# Builds the sdist and wheel on a version tag and uploads them to PyPI through
# trusted publishing (no API token: PyPI trusts this workflow's OIDC identity,
# registered under the project's "Publishing" settings, with the "pypi"
# environment).
#
# xrdclient is built on xrdcore, xrdsec and xrdhttp, which must already be on
# PyPI: the pre-flight refuses to publish otherwise, and the release wheel is
# then installed from PyPI's libraries alone, never from a checkout. Release
# order and the whole chain's runbook: docs/releasing.md.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Every step but the upload is xrd-devtools' shared publish action: build,
  # `twine check --strict`, the pre-flight (the libraries are on PyPI), then a
  # clean install whose tag, runtime version and dated changelog section agree.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: rob-c/xrd-devtools/.github/actions/publish@main
        with:
          package: xrdclient
          preflight: true

  # Trusted publishing ties PyPI's trust to this job of this workflow, so the
  # upload stays here, in a job that only downloads what the build staged.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
