name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  portable-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        platform:
          - manylinux_2_28_x86_64
          - manylinux_2_28_aarch64
          - musllinux_1_2_x86_64
          - musllinux_1_2_aarch64
          - macosx_11_0_x86_64
          - macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install --only-binary=:all: build
      - run: python -m build --wheel
      - name: Resolve base dependencies without source builds
        # Use the target interpreter for dependency environment markers too.
        run: >-
          python -m pip download --only-binary=:all:
          --implementation cp --python-version ${{ matrix.python-version }}
          --platform ${{ matrix.platform }}
          --dest wheelhouse dist/*.whl

  portable-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: >-
          python -m pip install --only-binary=:all: build
      - run: python -m build --wheel
      - name: Install and use the wheel in a clean environment
        run: |
          python -m venv /tmp/xrdclient-portable
          /tmp/xrdclient-portable/bin/python -m pip install --only-binary=:all: dist/*.whl
          /tmp/xrdclient-portable/bin/python -m pip check
          /tmp/xrdclient-portable/bin/python -c 'from importlib.util import find_spec; assert all(find_spec(name) is None for name in ("construct", "defusedxml", "gssapi", "krb5"))'
          /tmp/xrdclient-portable/bin/python -c 'import xrdclient; from xrdclient._xml import fromstring; assert fromstring(b"<doc/>").tag == "doc"'
      - name: Native macOS Kerberos also installs from wheels
        if: runner.os == 'macOS'
        run: |
          /tmp/xrdclient-portable/bin/python -m pip install --only-binary=:all: 'xrdclient[krb5]'
          /tmp/xrdclient-portable/bin/python -m pip check
          /tmp/xrdclient-portable/bin/python -c 'import gssapi, krb5; assert krb5.init_context() is not None'

  native-kerberos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native Kerberos source-build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - run: python -m pip install -e ".[dev,krb5]"
      - run: pytest -q tests/test_native_cache.py tests/test_portable_parsers.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff lint and security checks
        run: ruff check src tests benchmarks tools examples
      - name: ruff format
        run: ruff format --check src tests benchmarks tools examples
      - name: mypy --strict
        run: mypy
      - name: maintainability burn-down (must reach zero)
        run: python tools/maintainability.py check
      - name: build and inspect distributions
        run: |
          python -m build
          twine check --strict dist/*
      - name: smoke-test the built wheel
        run: |
          python -m venv /tmp/xrdclient-wheel
          /tmp/xrdclient-wheel/bin/python -m pip install dist/*.whl
          /tmp/xrdclient-wheel/bin/python -c 'import importlib.metadata as m, xrdclient; assert m.version("xrdclient") == xrdclient.__version__'

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Native Kerberos bindings are optional, not part of the default install.
      # The dev extra also exercises the fsspec adapter.
      - run: pip install -e ".[dev]"
      # pytest-cov rather than `coverage run`, because the workers xdist
      # spawns are separate processes and only pytest-cov collects them all.
      # `fail_under = 100` on proto/, crypto/ and client/ comes from
      # pyproject.toml, so the gate lives with the configuration.
      - name: pytest
        run: >-
          pytest -q -p no:cacheprovider -n auto
          -m "not interop and not parity"
          --cov=xrdclient --cov-report=term-missing

  interop:
    # A real daemon, because a fake written from the same reading of the
    # specification as the client would agree with a misreading.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GSSAPI build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          auto-activate-base: false
          activate-environment: interop
      - name: install xrootd and the official bindings
        shell: bash -el {0}
        run: conda install -y xrootd
      - name: install
        shell: bash -el {0}
        run: pip install -e ".[dev,krb5]"
      - name: interop and parity
        shell: bash -el {0}
        run: |
          xrootd -v
          pytest -q -p no:cacheprovider -m "interop or parity"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      # --strict turns a broken link or a page missing from the nav into a
      # failure, which is the only way documentation stays true.
      - run: mkdocs build --strict

  performance:
    # A gate, not a report: every case in benchmarks/compare.py must be won
    # against the official XRootD bindings on the same runner, by both the
    # native API and xrdclient.compat. Rounds are paired and interleaved and
    # a win must pass a one-sided sign test, so a noisy runner cannot turn a
    # loss into a pass by luck - only into a failure, which is re-runnable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          activate-environment: bench
      - shell: bash -el {0}
        run: conda install -y xrootd
      - shell: bash -el {0}
        run: pip install -e .
      - name: loopback
        shell: bash -el {0}
        run: python benchmarks/compare.py --gate --size 64 --rounds 15 --json loopback.json
      - name: 2 ms round trip
        shell: bash -el {0}
        run: python benchmarks/compare.py --gate --size 64 --rounds 15 --rtt 2 --json rtt2.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: "*.json"
