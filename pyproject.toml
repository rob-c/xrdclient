[build-system]
# Hatchling 1.32 emits Core Metadata 2.5, which Twine 6.2 cannot validate.
# Keep isolated and CI builds reproducible until the inspection tool catches up.
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "xrdclient"
dynamic = ["version"]
description = "A Python 3, Pythonic client for XRootD (root://, roots://) and HEP WebDAV"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Robert Currie", email = "robert.andrew.currie@gmail.com" }]
keywords = ["xrootd", "hep", "webdav", "storage", "root"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Filesystems",
]
# Maintained libraries provide reusable parsing, transport and security primitives.
dependencies = [
  "asn1crypto>=1.5.1",
  "botocore>=1.35",
  "cryptography>=45",
  "PyJWT[crypto]>=2.10",
  "urllib3>=2.2",
]

[project.urls]
Homepage = "https://github.com/rob-c/xrdclient"
Documentation = "https://rob-c.github.io/xrdclient/"
Repository = "https://github.com/rob-c/xrdclient"
Issues = "https://github.com/rob-c/xrdclient/issues"
Changelog = "https://github.com/rob-c/xrdclient/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Native Kerberos bindings need system headers when no wheel is available.
krb5 = ["gssapi>=1.12,<2", "krb5>=0.10,<0.11"]
dev = [
  "build>=1,<2",
  "complexipy>=6,<7",
  "fsspec>=2024.2.0",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov",
  "pytest-timeout",
  "pytest-xdist",
  "radon>=6,<7",
  "ruff>=0.5",
  "twine>=6,<7",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.5,<10",
  "mkdocstrings[python]>=0.25,<2",
]

[project.scripts]
xrd-cp = "xrdclient.cli.cp:main"
xrd-fs = "xrdclient.cli.fs:main"

[project.entry-points."fsspec.specs"]
root = "xrdclient.fsspec_impl:XRootDFileSystem"
roots = "xrdclient.fsspec_impl:XRootDFileSystem"
xroot = "xrdclient.fsspec_impl:XRootDFileSystem"
dav = "xrdclient.fsspec_impl:HTTPXRootDFileSystem"
davs = "xrdclient.fsspec_impl:HTTPXRootDFileSystem"
webdav = "xrdclient.fsspec_impl:HTTPXRootDFileSystem"

[tool.hatch.build.targets.wheel]
packages = ["src/xrdclient"]

[tool.hatch.version]
# One source of truth: wheels, sdists and the runtime API all read this value.
path = "src/xrdclient/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``tests/test_maintainability.py`` imports ``tools.maintainability``, and a
# bare ``pytest`` - which is what CI runs - does not put the working directory
# on the path the way ``python -m pytest`` does.
pythonpath = ["."]
timeout = 120
filterwarnings = ["error::ResourceWarning"]
markers = [
    "interop: needs a real xrootd daemon on PATH (the Kerberos ones, MIT krb5 as well)",
    "parity: needs the official XRootD python bindings as well",
]

[tool.coverage.run]
branch = true
source = ["xrdclient"]
parallel = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.$",
  "if __name__ == .__main__.:",
]
# The wire protocol, the cryptography and the client surface are where a gap
# in coverage means an untested code path against a real server, so they are
# gated at the full line-and-branch mark; the optional adapters (fsspec,
# asyncio, CLI) are not, because their coverage depends on which extras are
# installed - the suite covers those too, but only when they are there.
include = [
  "*/xrdclient/proto/*", "*/xrdclient/crypto/*", "*/xrdclient/client/*", "*/xrdclient/s3/*",
  "*/xrdclient/http/_engine.py", "*/xrdclient/http/_connection.py",
  "*/xrdclient/http/expect.py", "*/xrdclient/copy/_pipeline.py",
  "*/xrdclient/session/bulk.py",
  "*/xrdclient/cli/_output.py",
]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "UP", "B", "C4", "RUF",
  # High-confidence security checks. Broader Bandit-compatible rules are
  # deliberately reviewed rather than enabled wholesale: this client contains
  # protocol-mandated hashes, parsers and subprocesses which those rules cannot
  # distinguish from unsafe application code.
  "S102", "S307", "S506", "S602", "S608", "S609", "S701",
]
# RUF022/RUF023: ``__all__`` and ``__slots__`` are grouped by meaning here -
# urls, values, flags, errors - with a comment on each group. Alphabetising
# them would trade a reader's map of the package for a sort order nobody reads.
ignore = ["E741", "RUF022", "RUF023"]

[tool.mypy]
# The declared floor is 3.10: botocore and urllib3>=2.2 cannot be installed
# together on 3.9. The code itself is still kept to 3.9 syntax, which
# tests/test_compat.py enforces by parsing every shipped module as 3.9.
python_version = "3.10"
strict = true
packages = ["xrdclient"]
mypy_path = "src"

# The optional accelerators and adapters ship no stubs. They are reached
# through narrow, guarded imports, so untyped is the honest description of
# them rather than a hole in our own checking.
[[tool.mypy.overrides]]
module = ["google_crc32c.*", "fsspec.*"]
ignore_missing_imports = true

# ``AbstractFileSystem`` is therefore ``Any``, and subclassing it is the whole
# point of the adapter.
[[tool.mypy.overrides]]
module = "xrdclient.fsspec_impl"
disallow_subclassing_any = false
