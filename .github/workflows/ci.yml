name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xrdcore-ref:
        description: rob-c/xrdcore candidate ref
        default: main
      xrdsec-ref:
        description: rob-c/xrdsec candidate ref
        default: main
      xrdhttp-ref:
        description: rob-c/xrdhttp candidate ref
        default: main
      devtools-ref:
        description: rob-c/xrd-devtools ref whose gates and tools run
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"
  # Until the libraries are on PyPI, every job builds against the coordinated
  # candidates (xrd-devtools' candidates action); publish.yml validates the
  # release against PyPI instead.
  XRDCORE_REF: ${{ inputs.xrdcore-ref || 'main' }}
  XRDSEC_REF: ${{ inputs.xrdsec-ref || 'main' }}
  XRDHTTP_REF: ${{ inputs.xrdhttp-ref || 'main' }}
  DEVTOOLS_REF: ${{ inputs.devtools-ref || 'main' }}

jobs:
  portable-wheels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        platform:
          - manylinux_2_28_x86_64
          - manylinux_2_28_aarch64
          - musllinux_1_2_x86_64
          - musllinux_1_2_aarch64
          - macosx_11_0_x86_64
          - macosx_11_0_arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: wheels
      - run: >-
          python -m pip install --only-binary=:all: build
      - run: python -m build --wheel
      - name: Resolve base dependencies without source builds
        # Use the target interpreter for dependency environment markers too.
        # The library candidates resolve from the wheels just built.
        run: >-
          python -m pip download --only-binary=:all:
          --implementation cp --python-version ${{ matrix.python-version }}
          --platform ${{ matrix.platform }}
          --find-links .dependencies/wheels
          --dest wheelhouse dist/*.whl .dependencies/wheels/*.whl

  portable-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: wheels
      - run: >-
          python -m pip install --only-binary=:all: build
      - run: python -m build --wheel
      - name: Install and use the wheel in a clean environment
        run: |
          python -m venv /tmp/xrdclient-portable
          /tmp/xrdclient-portable/bin/python -m pip install --only-binary=:all: dist/*.whl .dependencies/wheels/*.whl
          /tmp/xrdclient-portable/bin/python -m pip check
          /tmp/xrdclient-portable/bin/python -c 'from importlib.util import find_spec; assert all(find_spec(name) is None for name in ("construct", "defusedxml", "gssapi", "krb5"))'
          /tmp/xrdclient-portable/bin/python -c 'import xrdclient; from xrdcore.safexml import fromstring; assert fromstring(b"<doc/>").tag == "doc"'
      - name: Native macOS Kerberos also installs from wheels
        if: runner.os == 'macOS'
        run: |
          /tmp/xrdclient-portable/bin/python -m pip install --only-binary=:all: --find-links .dependencies/wheels "$(ls dist/*.whl)[krb5]"
          /tmp/xrdclient-portable/bin/python -m pip check
          /tmp/xrdclient-portable/bin/python -c 'import gssapi; assert gssapi.Credentials is not None'

  native-kerberos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native Kerberos source-build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: editable
      - run: python -m pip install -e ".[dev,krb5]"
      - run: pytest -q tests/test_native_cache.py tests/test_krb5.py tests/test_dependency_adapters.py

  # ruff, mypy --strict (with python-gssapi's own types: the krb5 extra),
  # complexipy, the take-over scorecard, the maintainability check
  # (maintainability.json) and the configuration conformance check.
  static:
    uses: rob-c/xrd-devtools/.github/workflows/static.yml@main
    with:
      packages: xrdcore xrdsec xrdhttp
      xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
      xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
      xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
      devtools-ref: ${{ inputs.devtools-ref || 'main' }}
      extras: dev,krb5
      system-packages: libkrb5-dev
      paths: src tests benchmarks tools examples typings
      maintainability: true

  # No function duplicated across the chain; every repository's configuration
  # is the standard. This commit stands in for xrdclient's main.
  chain:
    uses: rob-c/xrd-devtools/.github/workflows/chain.yml@main
    with:
      xrdclient-ref: ${{ github.sha }}
      devtools-ref: ${{ inputs.devtools-ref || 'main' }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: editable
      - run: pip install -e ".[dev]"
      - name: build and inspect distributions
        run: |
          python -m build
          twine check --strict dist/*
      # Versions, layering, pins and changelog sections of this candidate and
      # the library candidates it was tested with (.dependencies is then a
      # workspace of sibling checkouts, as the pre-flight expects).
      - name: chain pre-flight
        run: |
          ln -s "$GITHUB_WORKSPACE" .dependencies/xrdclient
          xrddevtools preflight workspace --workspace .dependencies --no-build \
            --package xrdcore --package xrdsec --package xrdhttp --package xrdclient
      - name: smoke-test the built wheel
        run: |
          python -m venv /tmp/xrdclient-wheel
          /tmp/xrdclient-wheel/bin/python -m pip install dist/*.whl \
            .dependencies/xrdcore .dependencies/xrdsec .dependencies/xrdhttp
          /tmp/xrdclient-wheel/bin/python -c 'import importlib.metadata as m, xrdclient; assert m.version("xrdclient") == xrdclient.__version__'

  # Native Kerberos bindings are optional, not part of the default install;
  # the dev extra also exercises the fsspec adapter. ``fail_under = 100``
  # comes from pyproject.toml, so the gate lives with the configuration.
  test:
    uses: rob-c/xrd-devtools/.github/workflows/tests.yml@main
    with:
      packages: xrdcore xrdsec xrdhttp
      xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
      xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
      xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
      devtools-ref: ${{ inputs.devtools-ref || 'main' }}
      os: '["ubuntu-latest"]'
      include: '[{"os": "macos-latest", "python-version": "3.12"}]'
      markers: not interop and not parity
      pytest-args: --cov=xrdclient --cov-report=term-missing

  interop:
    # A real daemon, because a fake written from the same reading of the
    # specification as the client would agree with a misreading.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GSSAPI build prerequisites on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          auto-activate-base: false
          activate-environment: interop
      - name: install xrootd and the official bindings
        shell: bash -el {0}
        run: conda install -y xrootd
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: none
      - name: install
        shell: bash -el {0}
        run: >-
          pip install -e .dependencies/xrdcore -e .dependencies/xrdsec
          -e .dependencies/xrdhttp -e ".[dev,krb5]"
      - name: interop and parity
        shell: bash -el {0}
        run: |
          xrootd -v
          pytest -q -p no:cacheprovider -m "interop or parity"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: editable
      - run: pip install -e ".[docs]"
      # --strict turns a broken link or a page missing from the nav into a
      # failure, which is the only way documentation stays true.
      - run: mkdocs build --strict

  performance:
    # A gate, not a report: every case in benchmarks/compare.py must be won
    # against the official XRootD bindings on the same runner, by both the
    # native API and xrdclient.compat. Rounds are paired and interleaved and
    # a win must pass a one-sided sign test, so a noisy runner cannot turn a
    # loss into a pass by luck - only into a failure, which is re-runnable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          channels: conda-forge
          activate-environment: bench
      - shell: bash -el {0}
        run: conda install -y xrootd
      - uses: rob-c/xrd-devtools/.github/actions/candidates@main
        with:
          xrdcore-ref: ${{ env.XRDCORE_REF }}
          xrdsec-ref: ${{ env.XRDSEC_REF }}
          xrdhttp-ref: ${{ env.XRDHTTP_REF }}
          devtools-ref: ${{ env.DEVTOOLS_REF }}
          install: none
      - shell: bash -el {0}
        run: >-
          pip install -e .dependencies/xrdcore -e .dependencies/xrdsec
          -e .dependencies/xrdhttp -e .
      - name: loopback
        shell: bash -el {0}
        run: python benchmarks/compare.py --gate --size 64 --rounds 15 --json loopback.json
      - name: 2 ms round trip
        shell: bash -el {0}
        run: python benchmarks/compare.py --gate --size 64 --rounds 15 --rtt 2 --json rtt2.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance
          path: "*.json"
