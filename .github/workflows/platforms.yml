# The distribution matrix of the whole chain - Linux containers on both
# architectures, a real NixOS VM, the Homebrew bundles - is xrd-devtools'
# (rob-c/xrd-devtools, .github/workflows/platforms.yml, with the tools and
# packaging/ it runs). This repository runs it on its own commit, with the
# other candidates at the refs given (main by default).
name: Distribution packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      xgfalclient-ref:
        description: Matching xgfalclient candidate ref
        type: string
        default: main
      xrdcore-ref:
        description: rob-c/xrdcore candidate ref
        type: string
        default: main
      xrdsec-ref:
        description: rob-c/xrdsec candidate ref
        type: string
        default: main
      xrdhttp-ref:
        description: rob-c/xrdhttp candidate ref
        type: string
        default: main
      xrdarc-ref:
        description: rob-c/xrdarc candidate ref
        type: string
        default: main
      devtools-ref:
        description: rob-c/xrd-devtools ref
        type: string
        default: main

permissions:
  contents: read

jobs:
  platforms:
    uses: rob-c/xrd-devtools/.github/workflows/platforms.yml@main
    with:
      xrdclient-ref: ${{ github.sha }}
      xgfalclient-ref: ${{ inputs.xgfalclient-ref || 'main' }}
      xrdcore-ref: ${{ inputs.xrdcore-ref || 'main' }}
      xrdsec-ref: ${{ inputs.xrdsec-ref || 'main' }}
      xrdhttp-ref: ${{ inputs.xrdhttp-ref || 'main' }}
      xrdarc-ref: ${{ inputs.xrdarc-ref || 'main' }}
      devtools-ref: ${{ inputs.devtools-ref || 'main' }}
